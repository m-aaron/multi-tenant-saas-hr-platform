services:
  postgres:
    image: postgres:16-alpine

    container_name: hr-platform-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-hr_platform_dev}

    ports:
      - "${DATABASE_PORT:-5434}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - hr_platform_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: hr-platform-backend

    restart: unless-stopped

    env_file:
    - ./backend/.env.docker

    ports:
      - "${PORT:-4000}:4000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - hr_platform_network

volumes:
  postgres_data:

networks:
  hr_platform_network:
    driver: bridge
